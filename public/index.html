<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova inscrição</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Inscrições</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Nova inscrição</a></li>
            <li class="nav-item"><a class="nav-link" href="/admin">Admin</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container">
      <div id="flash"></div>
      <h1>Nova inscrição</h1>
      <form id="form" method="post" action="/api/inscricao" novalidate>
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">CPF</label>
            <input class="form-control" name="cpf" id="cpf" placeholder="000.000.000-00" required>
          </div>
          <div class="col-md-8">
            <label class="form-label">Nome completo</label>
            <input class="form-control" name="nome" id="nome" required minlength="2" maxlength="200">
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-3">
            <label class="form-label">Estado civil</label>
            <select class="form-select" name="estado_civil" id="estado_civil">
              <option value="">Selecione</option>
              <option value="solteiro">Solteiro(a)</option>
              <option value="casado">Casado(a)</option>
              <option value="divorciado">Divorciado(a)</option>
              <option value="viuvo">Viúvo(a)</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Sexo</label>
            <select class="form-select" name="sexo" id="sexo">
              <option value="">Selecione</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Data de nascimento</label>
            <input class="form-control" type="date" name="data_nascimento" id="data_nascimento" placeholder="YYYY-MM-DD">
          </div>
          <div class="col-md-3 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="chefe_de_equipe" id="chefe_de_equipe" value="on">
              <label class="form-check-label">Chefe de equipe</label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Endereço</label>
          <input class="form-control" name="endereco" id="endereco" maxlength="300">
        </div>
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Bairro</label>
            <input class="form-control" name="bairro" id="bairro" maxlength="150">
          </div>
          <div class="col-md-4">
            <label class="form-label">Cidade / Estado</label>
            <input class="form-control" name="cidade_estado" id="cidade_estado" maxlength="150">
          </div>
          <div class="col-md-4">
            <label class="form-label">Telefone</label>
            <input class="form-control" name="telefone" id="telefone" maxlength="20">
          </div>
        </div>
        <button class="btn btn-primary" type="submit">Enviar</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
